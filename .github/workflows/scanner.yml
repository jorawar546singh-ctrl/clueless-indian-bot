name: CLUELESS Indian Bot

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST (30 min after NSE close)
    # Mon-Fri only -- NSE doesn't trade weekends
    - cron: '30 10 * * 1-5'
  workflow_dispatch:  # allow manual triggers from Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSE scanner
        env:
          # Telegram env vars deliberately omitted here -- digest sends one consolidated message
          # at the end instead of per-breakout spam.
          PYTHONUNBUFFERED: "1"
        run: python nifty_scanner.py

      - name: Run streak tracker
        env:
          PYTHONUNBUFFERED: "1"
        run: python streak_tracker.py

      - name: Run position tracker
        env:
          PYTHONUNBUFFERED: "1"
        run: python position_tracker.py

      - name: Send EOD digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python telegram_digest.py

      - name: Commit results back to repo
        run: |
          git config user.name  "clueless-india-bot"
          git config user.email "bot@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
